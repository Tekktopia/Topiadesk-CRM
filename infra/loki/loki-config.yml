# =============================================================================
# TopiaDesk CRM — Loki configuration (single-binary / monolithic mode).
#
# Started with `-config.expand-env=true` (see docker-compose.yml), which
# makes Loki expand ${VAR}/${VAR:-default} references at load time — used
# below to drive retention_period straight from LOKI_RETENTION_HOURS
# (.env.example) instead of hardcoding a duplicate value here.
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION_HOURS:-720}h
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
