# =============================================================================
# TopiaDesk CRM — Traefik static configuration.
#
# Dashboard/API: deliberately NOT enabled here. `api.dashboard`/`api.insecure`
# are toggled via the TRAEFIK_API_DASHBOARD / TRAEFIK_API_INSECURE env vars
# (docker-compose.override.yml only, driven by TRAEFIK_DASHBOARD_ENABLED in
# .env) — Traefik natively maps `TRAEFIK_<STATIC_CONFIG_PATH>` env vars onto
# any static config key, so this file can stay identical between dev and
# prod-like runs while the dashboard is only ever reachable when explicitly
# opted into for local debugging (never on the base file used for a
# prod-like run).
# =============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
  # Dedicated entrypoint for Traefik's own `/ping` (health) endpoint — kept
  # off web/websecure so the healthcheck below never depends on TLS/routing
  # rules resolving correctly first.
  traefik:
    address: ":8082"

# Backs `traefik healthcheck` (the Dockerfile-free way to healthcheck
# Traefik itself — its CLI calls its own /ping over this entrypoint, no
# curl/wget dependency needed in the image).
ping:
  entryPoint: traefik

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    # Services must opt in via `traefik.enable=true` label — nothing is
    # auto-exposed just by joining the Docker network.
    exposedByDefault: false
    network: topiadesk_public
  file:
    directory: /etc/traefik/dynamic
    watch: true

# --- TLS ---------------------------------------------------------------------
# Local dev / prod-like local run: no certificatesResolvers configured. A
# real, mkcert-generated certificate for *.topiadesk.localhost is now wired
# up via dynamic.yml's `tls.certificates` (see that file's own comment for
# the regeneration command and why it's needed — a self-signed fallback is
# fine for normal page loads but a hard blocker for Service Worker
# registration specifically). If that certificate is ever missing/not yet
# generated on a fresh machine, every `websecure` router silently falls
# back to Traefik's own built-in self-signed "default certificate" instead
# (browsers show an untrusted-cert warning — fine for page loads, but
# service workers won't register until the real cert exists).
#
# Real production TLS (Let's Encrypt): DELIBERATELY NOT enabled here.
# `certificatesResolvers` was briefly turned on directly in this file and it
# is NOT inert just because no router references it — Traefik runs its ACME
# renewal-check goroutine and registers the TLS-ALPN-01 challenge handler on
# the `websecure` entrypoint unconditionally at startup, the moment the
# resolver is *defined*, regardless of whether any router's label uses
# `tls.certresolver=le`. In an environment with no real public DNS and no
# outbound path to acme-v02.api.letsencrypt.org (this one), that renewal
# check hangs and the TLS-ALPN-01 handler sits on the same port real HTTPS
# traffic uses — every websecure TLS handshake stalled and the whole app
# became unreachable. Found live: 2026-08-14.
#
# To actually go live with real TLS, define `certificatesResolvers` in a
# SEPARATE static-config file loaded only for a real deployment (e.g. via
# Traefik's `TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_*` env vars set only in
# that environment, not in this repo's default compose stack), alongside
# `docker-compose.prod-tls.yml`'s `tls.certresolver=le` router labels (see
# that file) — never uncomment a static resolver block in this shared file
# again. Requires a real public DNS record pointing at that host and port 80
# reachable from the internet for the HTTP-01 challenge. TRAEFIK_ACME_EMAIL
# (.env.example) is already wired for when that's set up.

log:
  level: INFO
accessLog: {}
