# =============================================================================
# TopiaDesk CRM — Traefik static configuration.
#
# Dashboard/API: deliberately NOT enabled here. `api.dashboard`/`api.insecure`
# are toggled via the TRAEFIK_API_DASHBOARD / TRAEFIK_API_INSECURE env vars
# (docker-compose.override.yml only, driven by TRAEFIK_DASHBOARD_ENABLED in
# .env) — Traefik natively maps `TRAEFIK_<STATIC_CONFIG_PATH>` env vars onto
# any static config key, so this file can stay identical between dev and
# prod-like runs while the dashboard is only ever reachable when explicitly
# opted into for local debugging (never on the base file used for a
# prod-like run).
# =============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
  # Dedicated entrypoint for Traefik's own `/ping` (health) endpoint — kept
  # off web/websecure so the healthcheck below never depends on TLS/routing
  # rules resolving correctly first.
  traefik:
    address: ":8082"

# Backs `traefik healthcheck` (the Dockerfile-free way to healthcheck
# Traefik itself — its CLI calls its own /ping over this entrypoint, no
# curl/wget dependency needed in the image).
ping:
  entryPoint: traefik

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    # Services must opt in via `traefik.enable=true` label — nothing is
    # auto-exposed just by joining the Docker network.
    exposedByDefault: false
    network: topiadesk_public
  file:
    directory: /etc/traefik/dynamic
    watch: true

# --- TLS ---------------------------------------------------------------------
# Local dev / prod-like local run: no certificatesResolvers router uses this
# by default, so every `websecure` router falls back to Traefik's own
# built-in on-the-fly self-signed "default certificate" — this is the
# "Traefik's own self-signed cert generation" mentioned in the infra spec;
# no manual cert step is required to get `https://*.topiadesk.localhost`
# working (browsers will show an untrusted-cert warning, which is expected
# and fine for local dev — trust the mkcert-style cert or click through).
#
# Real production TLS (Let's Encrypt): uncomment the resolver below AND add
# `traefik.http.routers.<name>.tls.certresolver=le` to the relevant service
# labels in docker-compose.yml. Requires: a real public DNS record pointing
# at this host, and port 80 reachable from the internet for the HTTP-01
# challenge. TRAEFIK_ACME_EMAIL (.env.example) is already wired for this.
#
# certificatesResolvers:
#   le:
#     acme:
#       email: "${TRAEFIK_ACME_EMAIL}"
#       storage: /letsencrypt/acme.json
#       httpChallenge:
#         entryPoint: web

log:
  level: INFO
accessLog: {}
