parent=keycloak.v2
import=common/keycloak

# Repeating the parent's own stylesheet here is required, not accidental —
# Keycloak's theme.properties inheritance does NOT append space-separated
# list properties (styles/scripts) across the parent chain, it replaces
# them outright. Listing css/styles.css first relies on resource-path
# fallback resolution to the parent theme's own file; topiadesk.css (ours)
# loads after it so our overrides win the cascade.
styles=css/styles.css css/topiadesk.css
scripts=js/topiadesk-wave.js

# Origin the login theme fetches per-tenant branding from (template.ftl's
# hero-mark <img>, GET /api/public/tenant-branding/{realm}/logo) — this
# theme is shared across every realm, so it has no other way to know the
# app's own public origin. Environment-specific: update this if
# APP_BASE_DOMAIN (.env) ever changes, e.g. for a real production domain
# instead of *.topiadesk.localhost. <img> loads aren't subject to CORS, so
# this can safely point cross-origin at app.${APP_BASE_DOMAIN} from
# auth.${APP_BASE_DOMAIN}.
tenantBrandingBaseUrl=https://app.topiadesk.localhost
