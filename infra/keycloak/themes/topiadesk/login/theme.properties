parent=keycloak.v2
import=common/keycloak

# Repeating the parent's own stylesheet here is required, not accidental —
# Keycloak's theme.properties inheritance does NOT append space-separated
# list properties (styles/scripts) across the parent chain, it replaces
# them outright. Listing css/styles.css first relies on resource-path
# fallback resolution to the parent theme's own file; topiadesk.css (ours)
# loads after it so our overrides win the cascade.
styles=css/styles.css css/topiadesk.css
scripts=js/topiadesk-wave.js
