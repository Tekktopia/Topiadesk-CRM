# =============================================================================
# TopiaDesk CRM — Postgres server configuration.
#
# Mounted read-only at /etc/postgresql/postgresql.conf and loaded via
# `-c config_file=...` (see docker-compose.yml `command:` for the postgres
# service). Values that are meant to be environment-driven
# (archive_timeout, from WAL_ARCHIVE_TIMEOUT_SECONDS) are passed as extra
# `-c` command-line flags instead of hardcoded here, since a mounted .conf
# file cannot itself reference docker-compose env vars — Postgres parses it
# literally, only docker-compose's `command:` list gets ${VAR} substitution.
# =============================================================================

listen_addresses = '*'
port = 5432

# scram-sha-256 (Postgres 16 default) — matches PgBouncer's
# AUTH_TYPE=scram-sha-256 (see docker-compose.yml pgbouncer service) and
# satisfies "no trust auth method" — every network connection must
# authenticate with a real credential. Local Unix-socket `trust` (used only
# by container-internal tooling like the initdb scripts) is untouched here;
# that is the standard, safe default in the base image's generated
# pg_hba.conf and is not a network-facing auth method.
password_encryption = scram-sha-256

# --- WAL archiving (continuous DR mechanism; see infra/backup/backup.sh for
# the complementary periodic pg_dump mechanism) ---------------------------
wal_level = replica
archive_mode = on
# %p = full path to the WAL segment to archive, %f = its filename.
# archive-wal.sh (baked into the custom infra/postgres/Dockerfile image)
# ships the segment into MINIO_BACKUPS_BUCKET under wal/ via `mc cp`. It
# resolves MinIO endpoint/credentials from the postgres container's own
# environment at execution time (see docker-compose.yml) — this string is
# static, but the shell command it invokes reads live env vars each run.
archive_command = '/usr/local/bin/archive-wal.sh %p %f'
# archive_timeout is set via `-c archive_timeout=${WAL_ARCHIVE_TIMEOUT_SECONDS}`
# on the container command line (docker-compose.yml), not here, so it stays
# driven by .env's WAL_ARCHIVE_TIMEOUT_SECONDS without editing this file.
max_wal_senders = 3
wal_keep_size = 512MB

# --- Reasonable single-instance defaults for a Phase-1 deployment ---------
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 64MB
max_connections = 200
log_timezone = 'UTC'
timezone = 'UTC'
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = off
log_disconnections = off
