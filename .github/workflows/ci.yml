name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '20.11.0'
  PNPM_VERSION: '9.15.0'

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration tests (real Postgres, RLS + audit-chain)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci_superuser_password
          POSTGRES_DB: topiadesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors infra/postgres/init/ — CI uses the plain postgres service
      # container (no custom init-script mount support in Actions'
      # `services:`), so role/extension bootstrap runs here as an explicit
      # step instead. Keep this in sync with infra/postgres/init/*.sh.
      - name: Bootstrap Postgres roles and extensions
        env:
          PGPASSWORD: ci_superuser_password
        run: |
          psql -h localhost -U postgres -d topiadesk -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_migrator LOGIN PASSWORD 'ci_migrator_password' CREATEDB;
          CREATE ROLE app_runtime LOGIN PASSWORD 'ci_runtime_password' NOBYPASSRLS;
          ALTER DATABASE topiadesk OWNER TO app_migrator;
          GRANT ALL ON SCHEMA public TO app_migrator;
          GRANT USAGE ON SCHEMA public TO app_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE app_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE app_migrator IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO app_runtime;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL

      - name: Run migrations + apply RLS/trigger SQL
        env:
          DATABASE_URL: postgresql://app_migrator:ci_migrator_password@localhost:5432/topiadesk
          DIRECT_URL: postgresql://app_migrator:ci_migrator_password@localhost:5432/topiadesk
        run: |
          pnpm --filter @topiadesk/db exec prisma migrate deploy
          pnpm --filter @topiadesk/db apply-sql

      - name: Seed
        env:
          DIRECT_URL: postgresql://app_migrator:ci_migrator_password@localhost:5432/topiadesk
        run: pnpm --filter @topiadesk/db seed

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://app_runtime:ci_runtime_password@localhost:5432/topiadesk
          DIRECT_URL: postgresql://app_migrator:ci_migrator_password@localhost:5432/topiadesk
          REDIS_URL: redis://localhost:6379
        run: pnpm test:integration

  docker-build-and-scan:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    needs: [lint-typecheck-unit]
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: topiadesk-${{ matrix.service }}:ci
          load: true

      - name: Trivy scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: topiadesk-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  playwright-smoke:
    name: Playwright smoke (golden path)
    runs-on: ubuntu-latest
    # Full docker-compose stack (Keycloak + api + web + db) needed for a real
    # browser smoke test — heavier than the other jobs, so it's the last
    # gate and only runs once everything else is already green.
    needs: [integration, docker-build-and-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env.example to .env for CI
        run: cp .env.example .env

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for api readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/ready && exit 0
            sleep 5
          done
          echo "api did not become ready in time" && exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @topiadesk/web exec playwright install --with-deps chromium

      - name: Run Playwright smoke suite
        run: pnpm --filter @topiadesk/web exec playwright test

      - name: Tear down stack
        if: always()
        run: docker compose down -v
